name: MCP API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  mcp-build-and-verify:
    name: MCP API Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify MCP API implementation
        shell: bash
        run: |
          set -e

          test -f src/pages/McpApi.tsx || {
            echo "ERROR: src/pages/McpApi.tsx not found"
            exit 1
          }

          test -f src/App.tsx || {
            echo "ERROR: src/App.tsx not found"
            exit 1
          }

          test -f src/components/HelpCenter.tsx || {
            echo "ERROR: src/components/HelpCenter.tsx not found"
            exit 1
          }

          grep -q "mcp-api" src/App.tsx || {
            echo "ERROR: /mcp-api route is not present in App.tsx"
            exit 1
          }

          grep -q "MCP API Reference" src/components/HelpCenter.tsx || {
            echo "ERROR: MCP API Reference link is not present in HelpCenter.tsx"
            exit 1
          }

          grep -q "/.mcp/list-tools" src/pages/McpApi.tsx || {
            echo "ERROR: /.mcp/list-tools documentation is missing"
            exit 1
          }

          grep -qi "JSON-RPC" src/pages/McpApi.tsx || {
            echo "ERROR: JSON-RPC documentation is missing"
            exit 1
          }

          grep -qi "curl" src/pages/McpApi.tsx || {
            echo "ERROR: curl examples are missing"
            exit 1
          }

          echo "MCP API verification passed."

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: eagle-mcp-production-build
          path: dist/
          retention-days: 14

  mcp-browser-test:
    name: MCP API Browser Test
    runs-on: ubuntu-latest
    needs: mcp-build-and-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/eagle-vite.log 2>&1 &
          echo $! > /tmp/eagle-vite.pid

      - name: Wait for application
        run: npx -y wait-on@9.0.1 http://127.0.0.1:8080

      - name: Test /mcp-api in browser
        shell: bash
        run: |
          mkdir -p playwright-tests

          cat > playwright-tests/mcp-api.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          test('MCP API Reference page renders correctly', async ({ page }) => {
            await page.goto('http://127.0.0.1:8080/mcp-api', {
              waitUntil: 'networkidle'
            });

            await expect(page).toHaveURL(/\/mcp-api$/);

            const body = await page.locator('body').innerText();

            expect(body).toContain('/.mcp/list-tools');
            expect(body).toMatch(/curl/i);
            expect(body).toMatch(/JSON-RPC/i);
          });
          EOF

          npx -y playwright@1.55.0 test playwright-tests/mcp-api.spec.cjs \
            --config=/dev/null \
            --reporter=line

      - name: Show application log on failure
        if: failure()
        run: |
          echo "===== Vite application log ====="
          cat /tmp/eagle-vite.log || true

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/eagle-vite.pid ]; then
            kill "$(cat /tmp/eagle-vite.pid)" || true
          fi
