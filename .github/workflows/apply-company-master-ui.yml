name: Apply company master multi-role UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[company-master-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch VesselManagement to use the shared company registry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/VesselManagement.tsx')
          s = p.read_text()

          old = """  // Setup data
  const ownerCompanies = useSetupCompanies('owner');
  const operatorCompanies = useSetupCompanies('operator');
  const technicalManagers = useSetupCompanies('technical');
  const ismManagers = useSetupCompanies('ism');
  const classificationSocieties = useClassificationSocieties();
  const flagStatesHook = useFlagStates();
"""

          new = """  // Setup data
  // One shared company master registry. A company can hold multiple roles.
  const allCompanies = useSetupCompanies();
  const ownerCompanies = allCompanies;
  const operatorCompanies = allCompanies;
  const technicalManagers = allCompanies;
  const ismManagers = allCompanies;
  const classificationSocieties = useClassificationSocieties();
  const flagStatesHook = useFlagStates();
"""

          if old not in s:
              raise SystemExit('Expected VesselManagement company hook block was not found.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify
        run: |
          grep -n "const allCompanies = useSetupCompanies();" src/components/VesselManagement.tsx
          grep -n "const ownerCompanies = allCompanies;" src/components/VesselManagement.tsx
          grep -n "const operatorCompanies = allCompanies;" src/components/VesselManagement.tsx
          grep -n "const technicalManagers = allCompanies;" src/components/VesselManagement.tsx
          grep -n "const ismManagers = allCompanies;" src/components/VesselManagement.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VesselManagement.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: use shared company master for vessel roles [company-master-ui]"
          git push

      - name: Remove one-time workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/apply-company-master-ui.yml
          git commit -m "chore: remove one-time company master UI workflow"
          git push
