name: Apply Setup Reference UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply setup-backed dropdown hardening
        run: python3 scripts/apply_setup_reference_ui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add src scripts .github/workflows/apply-setup-reference-ui.yml
          git commit -m "fix: enforce setup metadata as operational dropdown source"
          git push
